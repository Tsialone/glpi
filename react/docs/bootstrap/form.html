<!doctype html>
<html lang="fr" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuto bootsrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Icônes Bootstrap (Optionnel mais très utile) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container bg-dark-subtle">
      <div class="row mt-5 col-6 d-flex">
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
      </div>
    </div>
    <div class="container bg-dark-subtle">
      <div class="row mt-5 col-6 d-flex">
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
        <p class="text col-2 mt-4">Hello</p>
      </div>
    </div>
    <div class="d-flex justify-content-center container bg-dark-subtle mt-5">
      <div class="row col-6 mt-2">
        <table class="table table-bordered">
          <thead>
            <tr>
              <th class="col-6">Message</th>
              <th class="col-6">Coco</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Hello</td>
              <td>ROO</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="d-flex justify-content-center container bg-dark-subtle mt-5">
      <div class="row col-6 mt-2">
        <h4 class="text-white mb-1">Formulaire</h4>
        <div class="form-floating">
          <form action="" method="post">
            <div class="mb-3">
              <label for="name" class="form-label fw-bold text-light"
                >Name</label
              >
              <input
                type="text"
                class="form-control"
                id="name"
                placeholder="Ex: Jean Marie"
              />
            </div>

            <div class="mb-3">
              <label for="categorie" class="text-light fw-bold mb-1"
                >Categorie</label
              >
              <select class="form-select" id="categorie">
                <option value="">f</option>
              </select>
            </div>

            <button type="submit" class="btn btn-success mt-5">Valider</button>
          </form>
        </div>
      </div>
    </div>
    <!-- JS Bootstrap (Obligatoire pour les menus, modales, tooltips...) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
